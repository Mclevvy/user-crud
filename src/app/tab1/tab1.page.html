<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Add Book</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list inset="true" lines="full">
    <ion-list-header>
      <ion-label>Book details</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-label position="stacked">Title</ion-label>
      <ion-input [(ngModel)]="newBook.title" placeholder="e.g. The Hobbit"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Author</ion-label>
      <ion-input [(ngModel)]="newBook.author" placeholder="e.g. J.R.R. Tolkien"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Genre</ion-label>
      <ion-input [(ngModel)]="newBook.genre" placeholder="e.g. Fantasy"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Price</ion-label>
      <ion-input type="number" [(ngModel)]="newBook.price" placeholder="0.00"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Quantity</ion-label>
      <ion-input type="number" [(ngModel)]="newBook.quantity" placeholder="0"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" class="ion-margin-top" [disabled]="isSaving" (click)="addBook()">
    {{ isSaving ? 'Saving...' : 'Add Book' }}
  </ion-button>

  <!-- Extra component #1: ion-loading -->
  <ion-loading [isOpen]="isSaving" message="Saving book..."></ion-loading>

  <!-- Extra component #2: ion-toast -->
  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [color]="toastColor"
    [duration]="2000"
    (didDismiss)="showToast = false">
  </ion-toast>
</ion-content>
