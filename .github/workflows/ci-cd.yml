name: CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --configuration ci

      - name: Build application
        run: npm run build

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    # Deployment only runs for pushes to main, never for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    # Two pushes in a row must not race over the same container.
    concurrency:
      group: deployment
      cancel-in-progress: false
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm Docker is running
        run: docker info

      - name: Build Docker image
        run: docker build -t ionic-crud:latest .

      - name: Remove previous container
        run: docker rm -f ionic-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 ionic-crud:latest

      - name: Verify app
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }
